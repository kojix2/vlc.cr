name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: crystal spec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1

      - name: Install libVLC (Ubuntu)
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev

      - name: Install libVLC (macOS)
        if: startsWith(runner.os, 'macOS')
        run: |
          brew update
          # Install VLC app (contains libvlc.dylib & libvlccore.dylib)
          brew install --cask vlc
          # Symlink libraries so the linker can find them with -lvlc
          for d in /usr/local/lib /opt/homebrew/lib; do
            sudo mkdir -p "$d"
            sudo ln -sf /Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib "$d/libvlc.dylib"
            sudo ln -sf /Applications/VLC.app/Contents/MacOS/lib/libvlccore.dylib "$d/libvlccore.dylib"
          done

      - name: Configure dyld library path (macOS)
        if: startsWith(runner.os, 'macOS')
        run: |
          echo "DYLD_LIBRARY_PATH=/Applications/VLC.app/Contents/MacOS/lib:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=/Applications/VLC.app/Contents/MacOS/lib:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"

      - name: Install shards
        run: shards install

      - name: Run specs
        run: crystal spec

      - name: Build example
        run: crystal build examples/play_file.cr

  build_MinGW64:
    name: MinGW64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-crystal
            mingw-w64-x86_64-shards
            mingw-w64-x86_64-vlc
            git
            make
      - name: Install dependencies
        shell: msys2 {0}
        run: shards install
      - name: Run specs (MinGW)
        shell: msys2 {0}
        run: |
          crystal spec
      - name: Build example (play_bbc_vlc_cli)
        shell: msys2 {0}
        run: |
          crystal build examples/play_file.cr
