name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: crystal spec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1

      - name: Install libVLC (Ubuntu)
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev

      - name: Install libVLC (macOS)
        if: startsWith(runner.os, 'macOS')
        run: |
          brew update
          # Install VLC app (contains libvlc.dylib & libvlccore.dylib)
          brew install --cask vlc
          # Symlink libraries so the linker can find them with -lvlc
          for d in /usr/local/lib /opt/homebrew/lib; do
            sudo mkdir -p "$d"
            sudo ln -sf /Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib "$d/libvlc.dylib"
            sudo ln -sf /Applications/VLC.app/Contents/MacOS/lib/libvlccore.dylib "$d/libvlccore.dylib"
          done

      - name: Install libVLC (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: |
          choco --version
          choco install vlc -y
          # Add VLC install dir to PATH for runtime DLL resolving
          echo "C:\Program Files\VideoLAN\VLC" >> $env:GITHUB_PATH
          # Sanity check
          Get-ChildItem 'C:\Program Files\VideoLAN\VLC' -Filter 'libvlc*' -Recurse | Select-Object FullName

      - name: Download VLC SDK libraries (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vlcDir = 'C:\Program Files\VideoLAN\VLC'
          if (-not (Test-Path $vlcDir)) {
            throw "VLC directory not found at $vlcDir"
          }

          $versionRaw = (Get-Item "$vlcDir\vlc.exe").VersionInfo.ProductVersion
          if (-not $versionRaw) {
            throw 'Failed to detect VLC version'
          }
          Write-Host "Detected VLC version: $versionRaw"

          $candidateVersions = @($versionRaw)
          $parted = $versionRaw.Split('.')
          if ($parted.Length -gt 3) {
            $candidateVersions += ($parted[0..2] -join '.')
          }
          if ($versionRaw.Contains('+')) {
            $candidateVersions += $versionRaw.Split('+')[0]
          }
          $candidateVersions = $candidateVersions | Select-Object -Unique

          $downloaded = $false
          $zipPath = Join-Path $env:RUNNER_TEMP 'vlc-sdk.zip'
          foreach ($ver in $candidateVersions) {
            $zipName = "vlc-$ver-win64.zip"
            $uri = "https://download.videolan.org/pub/videolan/vlc/$ver/win64/$zipName"
            Write-Host "Attempting to download SDK from $uri"
            try {
              Invoke-WebRequest -Uri $uri -OutFile $zipPath -UseBasicParsing
              $downloaded = $true
              $usedVersion = $ver
              break
            } catch {
              Write-Host "Download failed for $uri"
            }
          }

          if (-not $downloaded) {
            throw "Unable to download VLC SDK matching version $versionRaw"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "vlc-sdk-$usedVersion"
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $libFiles = Get-ChildItem $extractDir -Recurse -Include 'libvlc.lib','libvlccore.lib' -File
          if (-not $libFiles -or $libFiles.Count -lt 2) {
            throw 'Downloaded SDK does not contain expected libvlc.lib files'
          }
          foreach ($lib in $libFiles) {
            Write-Host "Copying $($lib.FullName) to $vlcDir"
            Copy-Item $lib.FullName $vlcDir -Force
          }

          Add-Content -Path $env:GITHUB_ENV -Value "CRYSTAL_LIBRARY_PATH=$vlcDir"
          $libEnv = if ($env:LIB) { "$vlcDir;$env:LIB" } else { $vlcDir }
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$libEnv"

          Write-Host "Prepared VLC SDK libraries in $vlcDir"

      - name: Install shards
        run: shards install

      - name: Run specs
        run: crystal spec

      - name: Build example
        run: crystal build examples/play_file.cr

  build_MinGW64:
    name: MinGW64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-crystal
            mingw-w64-x86_64-shards
            mingw-w64-x86_64-vlc
            git
            make
      - name: Install dependencies
        shell: msys2 {0}
        run: shards install
      - name: Run specs (MinGW)
        shell: msys2 {0}
        run: |
          crystal spec
      - name: Build example (play_bbc_vlc_cli)
        shell: msys2 {0}
        run: |
          crystal build examples/play_bbc_vlc_cli.cr
