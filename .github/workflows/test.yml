name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: crystal spec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1

      - name: Install libVLC (Ubuntu)
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev

      - name: Install libVLC (macOS)
        if: startsWith(runner.os, 'macOS')
        run: |
          brew update
          # Install VLC app (contains libvlc.dylib & libvlccore.dylib)
          brew install --cask vlc
          # Symlink libraries so the linker can find them with -lvlc
          for d in /usr/local/lib /opt/homebrew/lib; do
            sudo mkdir -p "$d"
            sudo ln -sf /Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib "$d/libvlc.dylib"
            sudo ln -sf /Applications/VLC.app/Contents/MacOS/lib/libvlccore.dylib "$d/libvlccore.dylib"
          done

      - name: Install libVLC (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: |
          choco --version
          choco install vlc -y
          # Add VLC install dir to PATH for runtime DLL resolving
          echo "C:\Program Files\VideoLAN\VLC" >> $env:GITHUB_PATH
          # Sanity check
          Get-ChildItem 'C:\Program Files\VideoLAN\VLC' -Filter 'libvlc*' -Recurse | Select-Object FullName

      - name: Install shards
        run: shards install

      - name: Run specs
        run: crystal spec

      - name: Build example
        run: crystal build examples/play_file.cr
